{% extends 'base.html' %}

{% block title %}plAI: ¡Descúbrelo todo!{% endblock %}

{% block content %}
<section class="vh-100" style="background-color: #30B9DC;">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col col-xl-10">
        <div class="card" style="border-radius: 1rem;">
          <div class="row g-0">
            <div class="col-md-6 col-lg-5 d-none d-md-block">
              <img src="{{ url_for('static', filename='ingreso2.jpg') }}"
                alt="login form" class="img-fluid h-100 w-100" style="object-fit: cover; border-radius: 1rem 0 0 1rem;" />
            </div>
            <div class="col-md-6 col-lg-7 d-flex align-items-center">
              <div class="card-body p-4 p-lg-5 text-black">

                <form id="loginForm" method="POST" action="{{ url_for('auth.login') }}">
                  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                  <div class="d-flex align-items-center mb-3 pb-1">
                    <img src="{{ url_for('static', filename='plai-logo-horizontal.png') }}" alt="plAI">
                  </div>

                  <h3 class="mb-4 pb-2 pb-md-0 mb-md-5 px-md-2">Ingresa a tu cuenta</h3>

                  <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

                  <div class="mb-4">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" name="email" id="email" class="form-control form-control-lg" required />
                  </div>

                  <div class="mb-4">
                    <label class="form-label" for="password">Contraseña</label>
                    <input type="password" name="password" id="password" class="form-control form-control-lg" required />
                  </div>

                  <div class="pt-1 mb-4">
                    <button type="submit" class="btn btn-lg mb-1" style="background-color: #30B9DC; color: #0A2E43;">
                      Ingresar
                    </button>
                  </div>

                  <p class="mb-5 pb-lg-2" style="color: #0A2E43">¿No tienes cuenta? <a href="{{ url_for('auth.signup') }}"
                      style="color: #393f81;">Regístrate aquí</a></p>
                </form>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
<script>
// Progressive enhancement: submit as JSON so a failed login shows an inline error.
// Without JS the form posts normally and the server re-renders this page with a 401.
document.getElementById('loginForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  const errorBox = document.getElementById('login-error');
  errorBox.classList.add('d-none');
  try {
    const response = await fetch(event.target.action, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
      }),
    });
    const body = await response.json().catch(() => ({}));
    if (response.ok) {
      window.location.href = body.redirect;
    } else {
      errorBox.textContent = body.error || 'No se pudo iniciar sesión.';
      errorBox.classList.remove('d-none');
    }
  } catch (error) {
    errorBox.textContent = 'No se pudo conectar con el servidor.';
    errorBox.classList.remove('d-none');
  }
});
</script>

{% endblock %}
