[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plai"
version = "0.2.0"
description = "PlaIA: a movie and TV recommender chatbot built on Claude tool use"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Barbara Castillo" },
    { name = "Andres Ruggieri Lusso" },
    { name = "Juan Pablo Lazcano" },
]
dependencies = [
    "anthropic>=2.3.0",
    "bootstrap-flask>=2.4",
    "flask>=3.1",
    "flask-bcrypt>=1.0.1",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0",
    "flask-sqlalchemy>=3.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.optional-dependencies]
# Remote Turso/libSQL database (set DATABASE_URL to a sqlite+libsql:// URL).
turso = ["sqlalchemy-libsql"]
dev = ["pytest>=8", "pytest-mock>=3.17.0", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/plai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"migrations/*" = ["I", "UP"]
